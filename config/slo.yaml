service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    # Một request "tốt" = trả lời thành công VÀ nhanh hơn 3 s (ngưỡng P95 của dashboard).
    # Request lỗi (request_failed) hoặc chậm > 3000 ms đều tiêu error budget.
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: >
    Baseline đo được (20 request, trước CP1): P50 448 ms, P95 1164 ms, P99 1481 ms,
    retrieval success 100%, 0 lỗi. Sau khi prompt được cache, request ổn định ~160 ms;
    request đầu tiên sau khi restart có thể mất 1-8 s vì phải fetch prompt từ Langfuse.
    Ngưỡng 3000 ms cao hơn P99 baseline khoảng 2 lần. Practice rag_slow từng vượt
    ngưỡng khi cộng thêm thời gian fetch prompt, nhưng challenge rag_slow ổn định chỉ
    ~2653 ms/request nên alert P95 theo latency_ms không bắt được; cần thêm đo latency
    đầu cuối hoặc alert theo span retrieval. 99.5% nghĩa là cho phép 1/200 request
    chậm/lỗi theo SLI hiện tại.
  error_budget:
    formula: 'budget_bad_requests = (1 - 0.995) * total_requests_in_28d'
    example_at_1_rpm: >
      1 request/phút × 60 × 24 × 28 = 40,320 request/28 ngày
      → được phép tối đa 0.005 × 40,320 ≈ 201 request chậm hoặc lỗi.
    burn_rate: >
      burn_rate = (bad / total trong cửa sổ) / 0.005. Burn rate 1 tiêu hết budget đúng 28 ngày;
      burn rate 14.4 duy trì 1 giờ tiêu 14.4 × 1h / 672h ≈ 2.1% budget và sẽ cạn budget sau ~1.9 ngày.
    policy: >
      Còn > 50% budget: deploy/đổi prompt bình thường. Còn 10-50%: chỉ deploy khi có rollback plan
      (prompt label production có thể rollback ngay). < 10% hoặc đã cạn: freeze thay đổi prompt/model,
      ưu tiên fix độ tin cậy.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
