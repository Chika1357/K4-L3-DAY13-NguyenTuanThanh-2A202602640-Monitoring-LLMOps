alerts:
  - name: chat_latency_p95_high
    severity: P2
    condition: 'percentile(latency_ms of event == "response_sent", 95) > 3000 over 5m window'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-l3a-oncall'
    owner: nguyen-tuan-thanh (on-call)
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-1
  - name: chat_error_rate_high
    severity: P1
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2 over 5m window'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-l3a-oncall'
    owner: nguyen-tuan-thanh (on-call)
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-2
  - name: llm_cost_per_request_spike
    severity: P3
    condition: 'avg(cost_usd of event == "response_sent") > 0.005 USD over 15m window (baseline ≈ 0.0022, ~2x)'
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-l3a-llm-cost'
    owner: nguyen-tuan-thanh (on-call)
    slo: guardrails.daily_cost_usd_max
    runbook: docs/alerts.md#alert-3
